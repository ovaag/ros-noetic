# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-move-base
  version: 1.17.3
source:
  git: https://github.com/ros-gbp/navigation-release.git
  tag: release/noetic/move_base/1.17.3-1
  target_directory: ros-noetic-move-base/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/move_base
  license: BSD-3-Clause
  summary: The move_base package provides an implementation of an action (see the<a href="http://www.ros.org/wiki/actionlib">actionlib</a>package) that, given a goal in the world, will attempt to reach it with a mobile base. The move_base node links together a global and local planner to accomplish its global navigation task. It supports any global planner adhering to the nav_core::BaseGlobalPlanner interface specified in the<a href="http://www.ros.org/wiki/nav_core">nav_core</a>package and any local planner adhering to the nav_core::BaseLocalPlanner interface specified in the<a href="http://www.ros.org/wiki/nav_core">nav_core</a>package. The move_base node also maintains two costmaps, one for the global planner, and one for a local planner (see the<a href="http://www.ros.org/wiki/costmap_2d">costmap_2d</a>package) that are used to accomplish navigation tasks.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-actionlib
    - ros-noetic-base-local-planner
    - ros-noetic-catkin
    - ros-noetic-clear-costmap-recovery
    - ros-noetic-cmake-modules
    - ros-noetic-costmap-2d
    - ros-noetic-dynamic-reconfigure
    - ros-noetic-geometry-msgs
    - ros-noetic-message-generation
    - ros-noetic-move-base-msgs
    - ros-noetic-nav-core
    - ros-noetic-nav-msgs
    - ros-noetic-navfn
    - ros-noetic-pluginlib
    - ros-noetic-roscpp
    - ros-noetic-rospy
    - ros-noetic-rotate-recovery
    - ros-noetic-std-srvs
    - ros-noetic-tf2-geometry-msgs
    - ros-noetic-tf2-ros
    - ros-noetic-visualization-msgs
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-actionlib
    - ros-noetic-base-local-planner
    - ros-noetic-clear-costmap-recovery
    - ros-noetic-costmap-2d
    - ros-noetic-dynamic-reconfigure
    - ros-noetic-geometry-msgs
    - ros-noetic-message-runtime
    - ros-noetic-move-base-msgs
    - ros-noetic-nav-core
    - ros-noetic-nav-msgs
    - ros-noetic-navfn
    - ros-noetic-pluginlib
    - ros-noetic-roscpp
    - ros-noetic-rospy
    - ros-noetic-rotate-recovery
    - ros-noetic-std-srvs
    - ros-noetic-tf2-ros
    - ros-noetic-visualization-msgs
