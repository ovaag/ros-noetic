# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-rqt-robot-plugins
  version: 0.5.8
source:
  git: https://github.com/ros-gbp/rqt_robot_plugins-release.git
  tag: release/noetic/rqt_robot_plugins/0.5.8-1
  target_directory: ros-noetic-rqt-robot-plugins/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/rqt_robot_plugins
  repository: https://github.com/ros-visualization/rqt_robot_plugins
  license: BSD-3-Clause
  summary: Metapackage of rqt plugins that are particularly used with robots during its operation.<br/><br/>To run any rqt plugins, just type in a single command &quot;rqt&quot;, then select any plugins you want from the GUI that launches afterwards.<br/><br/>rqt consists of three following metapackages:<br/><ul><li><a href="http://ros.org/wiki/rqt">rqt</a>- provides a container window where all rqt tools can be docked at. rqt plugin developers barely needs to pay attention.</li><li><a href="http://ros.org/wiki/rqt_common_plugins">rqt_common_plugins</a>- ROS backend tools suite that can be used on/off of robot runtime.</li><li>rqt_robot_plugins (You're here!)</li></ul>
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-rqt-moveit
    - ros-noetic-rqt-nav-view
    - ros-noetic-rqt-pose-view
    - ros-noetic-rqt-robot-dashboard
    - ros-noetic-rqt-robot-monitor
    - ros-noetic-rqt-robot-steering
    - ros-noetic-rqt-runtime-monitor
    - ros-noetic-rqt-rviz
    - ros-noetic-rqt-tf-tree
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-rqt-moveit
    - ros-noetic-rqt-nav-view
    - ros-noetic-rqt-pose-view
    - ros-noetic-rqt-robot-dashboard
    - ros-noetic-rqt-robot-monitor
    - ros-noetic-rqt-robot-steering
    - ros-noetic-rqt-runtime-monitor
    - ros-noetic-rqt-rviz
    - ros-noetic-rqt-tf-tree
