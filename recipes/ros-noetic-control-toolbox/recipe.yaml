# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-control-toolbox
  version: 1.19.0
source:
  git: https://github.com/ros-gbp/control_toolbox-release.git
  tag: release/noetic/control_toolbox/1.19.0-1
  target_directory: ros-noetic-control-toolbox/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/control_toolbox
  repository: https://github.com/ros-controls/control_toolbox/
  license: BSD-3-Clause
  summary: The control toolbox contains modules that are useful across all controllers.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-cmake-modules
    - ros-noetic-control-msgs
    - ros-noetic-dynamic-reconfigure
    - ros-noetic-message-generation
    - ros-noetic-realtime-tools
    - ros-noetic-roscpp
    - ros-noetic-rosunit
    - ros-noetic-std-msgs
    - tinyxml
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-control-msgs
    - ros-noetic-dynamic-reconfigure
    - ros-noetic-message-runtime
    - ros-noetic-realtime-tools
    - ros-noetic-roscpp
    - ros-noetic-std-msgs
    - tinyxml
