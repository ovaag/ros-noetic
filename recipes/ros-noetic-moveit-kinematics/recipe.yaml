# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-moveit-kinematics
  version: 1.1.16
source:
  git: https://github.com/ros-gbp/moveit-release.git
  tag: release/noetic/moveit_kinematics/1.1.16-1
  target_directory: ros-noetic-moveit-kinematics/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://moveit.ros.org
  repository: https://github.com/moveit/moveit
  license: BSD-3-Clause
  summary: Package for all inverse kinematics solvers in MoveIt
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - numpy
    - orocos-kdl
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-moveit-core
    - ros-noetic-moveit-resources-fanuc-description
    - ros-noetic-moveit-resources-fanuc-moveit-config
    - ros-noetic-moveit-resources-panda-description
    - ros-noetic-moveit-resources-panda-moveit-config
    - ros-noetic-moveit-ros-planning
    - ros-noetic-pluginlib
    - ros-noetic-roscpp
    - ros-noetic-rostest
    - ros-noetic-tf2
    - ros-noetic-tf2-kdl
    - ros-noetic-xmlrpcpp
  run:
    - eigen
    - lxml
    - orocos-kdl
    - python
    - pyyaml
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-moveit-core
    - ros-noetic-pluginlib
    - ros-noetic-roscpp
    - ros-noetic-tf2
    - ros-noetic-tf2-kdl
    - urdfdom
