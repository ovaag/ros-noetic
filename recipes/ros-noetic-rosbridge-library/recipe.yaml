# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-rosbridge-library
  version: 0.11.17
source:
  git: https://github.com/RobotWebTools-release/rosbridge_suite-release.git
  tag: release/noetic/rosbridge_library/0.11.17-1
  target_directory: ros-noetic-rosbridge-library/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/rosbridge_library
  repository: https://github.com/RobotWebTools/rosbridge_suite
  license: BSD-3-Clause
  summary: The core rosbridge package, responsible for interpreting JSON and performing the appropriate ROS action, like subscribe, publish, call service, and interact with params.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pillow
    - pip
    - pymongo
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-actionlib-msgs
    - ros-noetic-catkin
    - ros-noetic-diagnostic-msgs
    - ros-noetic-geometry-msgs
    - ros-noetic-message-generation
    - ros-noetic-nav-msgs
    - ros-noetic-rospy-tutorials
    - ros-noetic-rostest
    - ros-noetic-rosunit
    - ros-noetic-sensor-msgs
    - ros-noetic-std-msgs
    - ros-noetic-std-srvs
    - ros-noetic-stereo-msgs
    - ros-noetic-tf2-msgs
    - ros-noetic-trajectory-msgs
    - ros-noetic-visualization-msgs
    - setuptools
  run:
    - pillow
    - pymongo
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-geometry-msgs
    - ros-noetic-message-runtime
    - ros-noetic-roscpp
    - ros-noetic-rosgraph
    - ros-noetic-rospy
    - ros-noetic-rosservice
    - ros-noetic-rostopic
    - ros-noetic-std-msgs
