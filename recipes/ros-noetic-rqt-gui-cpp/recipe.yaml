# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-rqt-gui-cpp
  version: 0.5.5
source:
  git: https://github.com/ros-gbp/rqt-release.git
  tag: release/noetic/rqt_gui_cpp/0.5.5-1
  target_directory: ros-noetic-rqt-gui-cpp/src/work
  patches:
    - patch/ros-noetic-rqt-gui-cpp.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/rqt_gui_cpp
  repository: https://github.com/ros-visualization/rqt
  license: BSD-3-Clause
  summary: rqt_gui_cpp enables GUI plugins to use the C++ client library for ROS.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - qt-main
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-nodelet
    - ros-noetic-qt-gui
    - ros-noetic-qt-gui-cpp
    - ros-noetic-roscpp
    - setuptools
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-nodelet
    - ros-noetic-qt-gui
    - ros-noetic-qt-gui-cpp
    - ros-noetic-roscpp
