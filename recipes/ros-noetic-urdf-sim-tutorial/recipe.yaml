# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-urdf-sim-tutorial
  version: 0.5.1
source:
  git: https://github.com/ros-gbp/urdf_sim_tutorial-release.git
  tag: release/noetic/urdf_sim_tutorial/0.5.1-1
  target_directory: ros-noetic-urdf-sim-tutorial/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: BSD-3-Clause
  summary: The urdf_sim_tutorial package
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-controller-manager
    - ros-noetic-diff-drive-controller
    - ros-noetic-gazebo-ros
    - ros-noetic-gazebo-ros-control
    - ros-noetic-joint-state-controller
    - ros-noetic-position-controllers
    - ros-noetic-robot-state-publisher
    - ros-noetic-rqt-robot-steering
    - ros-noetic-rviz
    - ros-noetic-urdf-tutorial
    - ros-noetic-xacro
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-controller-manager
    - ros-noetic-diff-drive-controller
    - ros-noetic-gazebo-ros
    - ros-noetic-gazebo-ros-control
    - ros-noetic-joint-state-controller
    - ros-noetic-position-controllers
    - ros-noetic-robot-state-publisher
    - ros-noetic-rqt-robot-steering
    - ros-noetic-rviz
    - ros-noetic-urdf-tutorial
    - ros-noetic-xacro
