# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-ros-comm
  version: 1.17.4
source:
  git: https://github.com/ros-gbp/ros_comm-release.git
  tag: release/noetic/ros_comm/1.17.4-1
  target_directory: ros-noetic-ros-comm/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/ros_comm
  license: BSD-3-Clause
  summary: ROS communications-related packages, including core client libraries (roscpp, rospy) and graph introspection tools (rostopic, rosnode, rosservice, rosparam).
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-message-filters
    - ros-noetic-ros
    - ros-noetic-rosbag
    - ros-noetic-rosconsole
    - ros-noetic-roscpp
    - ros-noetic-rosgraph
    - ros-noetic-rosgraph-msgs
    - ros-noetic-roslaunch
    - ros-noetic-roslisp
    - ros-noetic-rosmaster
    - ros-noetic-rosmsg
    - ros-noetic-rosnode
    - ros-noetic-rosout
    - ros-noetic-rosparam
    - ros-noetic-rospy
    - ros-noetic-rosservice
    - ros-noetic-rostest
    - ros-noetic-rostopic
    - ros-noetic-roswtf
    - ros-noetic-std-srvs
    - ros-noetic-topic-tools
    - ros-noetic-xmlrpcpp
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-message-filters
    - ros-noetic-ros
    - ros-noetic-rosbag
    - ros-noetic-rosconsole
    - ros-noetic-roscpp
    - ros-noetic-rosgraph
    - ros-noetic-rosgraph-msgs
    - ros-noetic-roslaunch
    - ros-noetic-roslisp
    - ros-noetic-rosmaster
    - ros-noetic-rosmsg
    - ros-noetic-rosnode
    - ros-noetic-rosout
    - ros-noetic-rosparam
    - ros-noetic-rospy
    - ros-noetic-rosservice
    - ros-noetic-rostest
    - ros-noetic-rostopic
    - ros-noetic-roswtf
    - ros-noetic-std-srvs
    - ros-noetic-topic-tools
    - ros-noetic-xmlrpcpp
