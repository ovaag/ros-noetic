# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-moveit-setup-assistant
  version: 1.1.16
source:
  git: https://github.com/ros-gbp/moveit-release.git
  tag: release/noetic/moveit_setup_assistant/1.1.16-1
  target_directory: ros-noetic-moveit-setup-assistant/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://moveit.ros.org
  repository: https://github.com/moveit/moveit
  license: BSD-3-Clause
  summary: Generates a configuration package that makes it easy to use MoveIt
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libgl-devel
    - libopengl-devel
    - numpy
    - ogre
    - ompl
    - pip
    - python
    - qt-main
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-moveit-core
    - ros-noetic-moveit-resources-panda-moveit-config
    - ros-noetic-moveit-ros-planning
    - ros-noetic-moveit-ros-visualization
    - ros-noetic-ompl
    - ros-noetic-rosconsole
    - ros-noetic-roscpp
    - ros-noetic-rosunit
    - ros-noetic-rviz
    - ros-noetic-srdfdom
    - ros-noetic-urdf
    - yaml-cpp
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-moveit-core
    - ros-noetic-moveit-ros-planning
    - ros-noetic-moveit-ros-visualization
    - ros-noetic-rosconsole
    - ros-noetic-roscpp
    - ros-noetic-rviz
    - ros-noetic-srdfdom
    - ros-noetic-urdf
    - ros-noetic-xacro
    - yaml-cpp
