# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-rqt-common-plugins
  version: 0.4.11
source:
  git: https://github.com/ros-gbp/rqt_common_plugins-release.git
  tag: release/noetic/rqt_common_plugins/0.4.11-1
  target_directory: ros-noetic-rqt-common-plugins/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/rqt_common_plugins
  repository: https://github.com/ros-visualization/rqt_common_plugins
  license: BSD-3-Clause
  summary: rqt_common_plugins metapackage provides ROS backend graphical tools suite that can be used on/off of robot runtime.<br/><br/>To run any rqt plugins, just type in a single command &quot;rqt&quot;, then select any plugins you want from the GUI that launches afterwards.<br/><br/>rqt consists of three following metapackages:<br/><ul><li><a href="http://ros.org/wiki/rqt">rqt</a>- core modules of rqt (ROS GUI) framework. rqt plugin developers barely needs to pay attention to this metapackage.</li><li>rqt_common_plugins (you're here!)</li><li><a href="http://ros.org/wiki/rqt_robot_plugins">rqt_robot_plugins</a>- rqt plugins that are particularly used with robots during their runtime.</li><br/></ul><br/>
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-rqt-action
    - ros-noetic-rqt-bag
    - ros-noetic-rqt-bag-plugins
    - ros-noetic-rqt-console
    - ros-noetic-rqt-dep
    - ros-noetic-rqt-graph
    - ros-noetic-rqt-image-view
    - ros-noetic-rqt-launch
    - ros-noetic-rqt-logger-level
    - ros-noetic-rqt-msg
    - ros-noetic-rqt-plot
    - ros-noetic-rqt-publisher
    - ros-noetic-rqt-py-common
    - ros-noetic-rqt-py-console
    - ros-noetic-rqt-reconfigure
    - ros-noetic-rqt-service-caller
    - ros-noetic-rqt-shell
    - ros-noetic-rqt-srv
    - ros-noetic-rqt-top
    - ros-noetic-rqt-topic
    - ros-noetic-rqt-web
