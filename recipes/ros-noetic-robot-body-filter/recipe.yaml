# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-robot-body-filter
  version: 1.3.2
source:
  git: https://github.com/peci1/robot_body_filter-release.git
  tag: release/noetic/robot_body_filter/1.3.2-1
  target_directory: ros-noetic-robot-body-filter/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/peci1/robot_body_filter
  license: BSD-3-Clause
  summary: Filters the robot's body out of laser scans or point clouds.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - numpy
    - pcl
    - pip
    - pkg-config
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-dynamic-reconfigure
    - ros-noetic-fcl
    - ros-noetic-filters
    - ros-noetic-geometric-shapes
    - ros-noetic-geometry-msgs
    - ros-noetic-laser-geometry
    - ros-noetic-message-generation
    - ros-noetic-message-runtime
    - ros-noetic-moveit-core
    - ros-noetic-moveit-ros-perception
    - ros-noetic-pcl-conversions
    - ros-noetic-roscpp
    - ros-noetic-rostest
    - ros-noetic-sensor-msgs
    - ros-noetic-std-msgs
    - ros-noetic-tf2
    - ros-noetic-tf2-eigen
    - ros-noetic-tf2-ros
    - ros-noetic-tf2-sensor-msgs
    - ros-noetic-urdf
    - ros-noetic-visualization-msgs
    - vtk-base
  run:
    - libboost-devel
    - pcl
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-dynamic-reconfigure
    - ros-noetic-fcl
    - ros-noetic-filters
    - ros-noetic-geometric-shapes
    - ros-noetic-geometry-msgs
    - ros-noetic-laser-geometry
    - ros-noetic-message-runtime
    - ros-noetic-moveit-core
    - ros-noetic-moveit-ros-perception
    - ros-noetic-pcl-conversions
    - ros-noetic-roscpp
    - ros-noetic-sensor-msgs
    - ros-noetic-std-msgs
    - ros-noetic-tf2
    - ros-noetic-tf2-ros
    - ros-noetic-urdf
    - ros-noetic-visualization-msgs
    - vtk-base
