# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-depth-image-proc
  version: 1.17.0
source:
  git: https://github.com/ros-gbp/image_pipeline-release.git
  tag: release/noetic/depth_image_proc/1.17.0-1
  target_directory: ros-noetic-depth-image-proc/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/depth_image_proc
  license: BSD-3-Clause
  summary: Contains nodelets for processing depth images such as those produced by OpenNI camera. Functions include creating disparity images and point clouds, as well as registering (reprojecting) a depth image into another camera frame.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - libboost-python-devel
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-cmake-modules
    - ros-noetic-cv-bridge
    - ros-noetic-eigen-conversions
    - ros-noetic-image-geometry
    - ros-noetic-image-transport
    - ros-noetic-message-filters
    - ros-noetic-nodelet
    - ros-noetic-rostest
    - ros-noetic-sensor-msgs
    - ros-noetic-stereo-msgs
    - ros-noetic-tf2
    - ros-noetic-tf2-ros
  run:
    - libboost-devel
    - libboost-python-devel
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-cv-bridge
    - ros-noetic-eigen-conversions
    - ros-noetic-image-geometry
    - ros-noetic-image-transport
    - ros-noetic-nodelet
    - ros-noetic-sensor-msgs
    - ros-noetic-tf2
    - ros-noetic-tf2-ros
