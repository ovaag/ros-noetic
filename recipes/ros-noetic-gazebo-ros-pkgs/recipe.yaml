# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-gazebo-ros-pkgs
  version: 2.9.3
source:
  git: https://github.com/ros-gbp/gazebo_ros_pkgs-release.git
  tag: release/noetic/gazebo_ros_pkgs/2.9.3-1
  target_directory: ros-noetic-gazebo-ros-pkgs/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://gazebosim.org/tutorials?cat=connect_ros
  repository: https://github.com/ros-simulation/gazebo_ros_pkgs
  license: BSD-3-Clause OR LGPL-2.1-or-later OR Apache-2.0
  summary: Interface for using ROS with the<a href="http://gazebosim.org/">Gazebo</a>simulator.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-gazebo-dev
    - ros-noetic-gazebo-msgs
    - ros-noetic-gazebo-plugins
    - ros-noetic-gazebo-ros
