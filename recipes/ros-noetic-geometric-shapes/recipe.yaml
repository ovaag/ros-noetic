# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-geometric-shapes
  version: 0.7.7
source:
  git: https://github.com/ros-gbp/geometric_shapes-release.git
  tag: release/noetic/geometric_shapes/0.7.7-1
  target_directory: ros-noetic-geometric-shapes/src/work
  patches:
    - patch/ros-noetic-geometric-shapes.patch
    - patch/ros-noetic-geometric-shapes.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/geometric_shapes
  license: BSD-3-Clause
  summary: Generic definitions of geometric shapes and bodies.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - assimp
    - if: build_platform == target_platform
      then:
        - pkg-config
    - console_bridge
    - eigen
    - libboost-devel
    - libboost-python-devel
    - numpy
    - pip
    - pkg-config
    - python
    - qhull
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-eigen-stl-containers
    - ros-noetic-fcl
    - ros-noetic-octomap
    - ros-noetic-random-numbers
    - ros-noetic-resource-retriever
    - ros-noetic-rosunit
    - ros-noetic-shape-msgs
    - ros-noetic-visualization-msgs
  run:
    - assimp
    - console_bridge
    - eigen
    - libboost-devel
    - libboost-python-devel
    - python
    - qhull
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-eigen-stl-containers
    - ros-noetic-fcl
    - ros-noetic-octomap
    - ros-noetic-random-numbers
    - ros-noetic-resource-retriever
    - ros-noetic-shape-msgs
    - ros-noetic-visualization-msgs
