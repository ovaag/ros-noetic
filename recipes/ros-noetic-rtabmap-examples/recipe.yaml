# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-rtabmap-examples
  version: 0.21.13
source:
  git: https://github.com/introlab/rtabmap_ros-release.git
  tag: release/noetic/rtabmap_examples/0.21.13-1
  target_directory: ros-noetic-rtabmap-examples/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/introlab/rtabmap_ros
  license: BSD-3-Clause
  summary: RTAB-Map's example launch files.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-message-filters
    - ros-noetic-roscpp
    - ros-noetic-rtabmap-conversions
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-imu-complementary-filter
    - ros-noetic-imu-filter-madgwick
    - ros-noetic-message-filters
    - ros-noetic-realsense2-camera
    - ros-noetic-robot-localization
    - ros-noetic-roscpp
    - ros-noetic-rtabmap-conversions
    - ros-noetic-rtabmap-costmap-plugins
    - ros-noetic-rtabmap-demos
    - ros-noetic-rtabmap-launch
    - ros-noetic-rtabmap-msgs
    - ros-noetic-rtabmap-odom
    - ros-noetic-rtabmap-rviz-plugins
    - ros-noetic-rtabmap-slam
    - ros-noetic-rtabmap-util
    - ros-noetic-rtabmap-viz
    - ros-noetic-velodyne-pointcloud
