# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-rqt-rviz
  version: 0.7.2
source:
  git: https://github.com/ros-gbp/rqt_rviz-release.git
  tag: release/noetic/rqt_rviz/0.7.2-1
  target_directory: ros-noetic-rqt-rviz/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/rqt_rviz
  repository: https://github.com/ros-visualization/rqt_rviz
  license: BSD-3-Clause
  summary: rqt_rviz provides a GUI plugin embedding<a href="http://www.ros.org/wiki/rviz">RViz</a>. Note that this rqt plugin does NOT supersede RViz but depends on it.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - libboost-python-devel
    - numpy
    - pip
    - python
    - qt-main
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-class-loader
    - ros-noetic-pluginlib
    - ros-noetic-rqt-gui
    - ros-noetic-rqt-gui-cpp
    - ros-noetic-rviz
  run:
    - libboost-devel
    - libboost-python-devel
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-pluginlib
    - ros-noetic-rqt-gui
    - ros-noetic-rqt-gui-cpp
    - ros-noetic-rviz
