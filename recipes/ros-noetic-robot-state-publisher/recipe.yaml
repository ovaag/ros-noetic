# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-robot-state-publisher
  version: 1.15.3
source:
  git: https://github.com/ros-gbp/robot_state_publisher-release.git
  tag: release/noetic/robot_state_publisher/1.15.3-1
  target_directory: ros-noetic-robot-state-publisher/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/robot_state_publisher
  license: BSD-3-Clause
  summary: This package allows you to publish the state of a robot to<a href="http://ros.org/wiki/tf2">tf2</a>. Once the state gets published, it is available to all components in the system that also use<tt>tf2</tt>. The package takes the joint angles of the robot as input and publishes the 3D poses of the robot links, using a kinematic tree model of the robot. The package can both be used as a library and as a ROS node. This package has been well tested and the code is stable. No major changes are planned in the near future.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - numpy
    - orocos-kdl
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-kdl-parser
    - ros-noetic-rosbag
    - ros-noetic-rosconsole
    - ros-noetic-roscpp
    - ros-noetic-rostest
    - ros-noetic-rostime
    - ros-noetic-sensor-msgs
    - ros-noetic-tf
    - ros-noetic-tf2-kdl
    - ros-noetic-tf2-ros
    - urdfdom_headers
  run:
    - orocos-kdl
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-kdl-parser
    - ros-noetic-rosconsole
    - ros-noetic-roscpp
    - ros-noetic-rostime
    - ros-noetic-sensor-msgs
    - ros-noetic-tf
    - ros-noetic-tf2-kdl
    - ros-noetic-tf2-ros
