# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-dynamic-reconfigure
  version: 1.7.6
source:
  git: https://github.com/ros-gbp/dynamic_reconfigure-release.git
  tag: release/noetic/dynamic_reconfigure/1.7.6-1
  target_directory: ros-noetic-dynamic-reconfigure/src/work
  patches:
    - patch/ros-noetic-dynamic-reconfigure.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/dynamic_reconfigure
  repository: https://github.com/ros/dynamic_reconfigure
  license: BSD-3-Clause
  summary: The dynamic_reconfigure package provides a means to update parameters at runtime without having to restart the node.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-cpp-common
    - ros-noetic-message-generation
    - ros-noetic-roscpp
    - ros-noetic-roscpp-serialization
    - ros-noetic-rostest
    - ros-noetic-std-msgs
  run:
    - libboost-devel
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-message-runtime
    - ros-noetic-roscpp
    - ros-noetic-roslib
    - ros-noetic-rospy
    - ros-noetic-rosservice
    - ros-noetic-std-msgs
