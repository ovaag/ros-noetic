# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-diagnostics
  version: 1.12.1
source:
  git: https://github.com/ros-gbp/diagnostics-release.git
  tag: release/noetic/diagnostics/1.12.1-1
  target_directory: ros-noetic-diagnostics/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://www.ros.org/wiki/diagnostics
  license: BSD-3-Clause
  summary: diagnostics
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-diagnostic-aggregator
    - ros-noetic-diagnostic-analysis
    - ros-noetic-diagnostic-common-diagnostics
    - ros-noetic-diagnostic-updater
    - ros-noetic-self-test
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-diagnostic-aggregator
    - ros-noetic-diagnostic-analysis
    - ros-noetic-diagnostic-common-diagnostics
    - ros-noetic-diagnostic-updater
    - ros-noetic-self-test
