# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-panda-moveit-config
  version: 0.8.1
source:
  git: https://github.com/ros-gbp/panda_moveit_config-release.git
  tag: release/noetic/panda_moveit_config/0.8.1-1
  target_directory: ros-noetic-panda-moveit-config/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://moveit.ros.org/
  repository: https://github.com/ros-planning/moveit
  license: BSD-3-Clause
  summary: An automatically generated package with all the configuration and launch files for using the panda with the MoveIt Motion Planning Framework
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-franka-description
    - ros-noetic-joint-state-publisher
    - ros-noetic-joint-state-publisher-gui
    - ros-noetic-moveit-fake-controller-manager
    - ros-noetic-moveit-kinematics
    - ros-noetic-moveit-planners-ompl
    - ros-noetic-moveit-ros-move-group
    - ros-noetic-moveit-ros-visualization
    - ros-noetic-moveit-setup-assistant
    - ros-noetic-moveit-simple-controller-manager
    - ros-noetic-robot-state-publisher
    - ros-noetic-rviz
    - ros-noetic-tf2-ros
    - ros-noetic-xacro
  run:
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-franka-description
    - ros-noetic-joint-state-publisher
    - ros-noetic-joint-state-publisher-gui
    - ros-noetic-moveit-fake-controller-manager
    - ros-noetic-moveit-kinematics
    - ros-noetic-moveit-planners-ompl
    - ros-noetic-moveit-ros-move-group
    - ros-noetic-moveit-ros-visualization
    - ros-noetic-moveit-setup-assistant
    - ros-noetic-moveit-simple-controller-manager
    - ros-noetic-robot-state-publisher
    - ros-noetic-rviz
    - ros-noetic-tf2-ros
    - ros-noetic-xacro
