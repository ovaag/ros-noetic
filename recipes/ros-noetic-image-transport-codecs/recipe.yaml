# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-image-transport-codecs
  version: 2.5.1
source:
  git: https://gitlab.fel.cvut.cz/cras/ros-release/ros-utils.git
  tag: release/noetic/image_transport_codecs/2.5.1-1
  target_directory: ros-noetic-image-transport-codecs/src/work
  patches:
    - patch/ros-noetic-image-transport-codecs.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://wiki.ros.org/image_transport_codecs
  repository: https://github.com/ctu-vras/ros-utils
  license: BSD-3-Clause
  summary: Image transport plugins available as C, C++ and Python libraries
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libjpeg-turbo
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-class-loader
    - ros-noetic-compressed-depth-image-transport
    - ros-noetic-compressed-image-transport
    - ros-noetic-cras-cpp-common
    - ros-noetic-cras-topic-tools
    - ros-noetic-dynamic-reconfigure
    - ros-noetic-image-transport
    - ros-noetic-pluginlib
    - ros-noetic-rosbag
    - ros-noetic-roslint
    - ros-noetic-sensor-msgs
    - ros-noetic-theora-image-transport
    - ros-noetic-topic-tools
  run:
    - libjpeg-turbo
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-class-loader
    - ros-noetic-compressed-depth-image-transport
    - ros-noetic-compressed-image-transport
    - ros-noetic-cras-cpp-common
    - ros-noetic-cras-topic-tools
    - ros-noetic-dynamic-reconfigure
    - ros-noetic-image-transport
    - ros-noetic-pluginlib
    - ros-noetic-sensor-msgs
    - ros-noetic-theora-image-transport
    - ros-noetic-topic-tools
