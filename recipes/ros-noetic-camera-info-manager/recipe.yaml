# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-camera-info-manager
  version: 1.12.1
source:
  git: https://github.com/ros-gbp/image_common-release.git
  tag: release/noetic/camera_info_manager/1.12.1-1
  target_directory: ros-noetic-camera-info-manager/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/camera_info_manager
  repository: https://github.com/ros-perception/image_common
  license: BSD-3-Clause
  summary: This package provides a C++ interface for camera calibration information. It provides CameraInfo, and handles SetCameraInfo service requests, saving and restoring the camera calibration data.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - gtest
    - libboost-devel
    - libboost-python-devel
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-camera-calibration-parsers
    - ros-noetic-catkin
    - ros-noetic-image-transport
    - ros-noetic-roscpp
    - ros-noetic-roslib
    - ros-noetic-rostest
    - ros-noetic-sensor-msgs
  run:
    - libboost-devel
    - libboost-python-devel
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-camera-calibration-parsers
    - ros-noetic-image-transport
    - ros-noetic-roscpp
    - ros-noetic-roslib
    - ros-noetic-sensor-msgs
