# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-rosbag-storage
  version: 1.17.4
source:
  git: https://github.com/ros-gbp/ros_comm-release.git
  tag: release/noetic/rosbag_storage/1.17.4-1
  target_directory: ros-noetic-rosbag-storage/src/work
  patches:
    - patch/ros-noetic-rosbag-storage.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: BSD-3-Clause
  summary: This is a set of tools for recording from and playing back ROS message without relying on the ROS client library.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - bzip2
    - console_bridge
    - libboost-devel
    - numpy
    - openssl
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-cpp-common
    - ros-noetic-pluginlib
    - ros-noetic-roscpp-serialization
    - ros-noetic-roscpp-traits
    - ros-noetic-roslz4
    - ros-noetic-rostest
    - ros-noetic-rostime
    - ros-noetic-std-msgs
  run:
    - bzip2
    - console_bridge
    - libboost-devel
    - openssl
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-cpp-common
    - ros-noetic-pluginlib
    - ros-noetic-roscpp-serialization
    - ros-noetic-roscpp-traits
    - ros-noetic-roslz4
    - ros-noetic-rostime
