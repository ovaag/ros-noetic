# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-rospy
  version: 1.17.4
source:
  git: https://github.com/ros-gbp/ros_comm-release.git
  tag: release/noetic/rospy/1.17.4-1
  target_directory: ros-noetic-rospy/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/rospy
  repository: https://github.com/ros/ros_comm
  license: BSD-3-Clause
  summary: rospy is a pure Python client library for ROS. The rospy client API enables Python programmers to quickly interface with ROS<a href="http://ros.org/wiki/Topics">Topics</a>,<a href="http://ros.org/wiki/Services">Services</a>, and<a href="http://ros.org/wiki/Parameter Server">Parameters</a>. The design of rospy favors implementation speed (i.e. developer time) over runtime performance so that algorithms can be quickly prototyped and tested within ROS. It is also ideal for non-critical-path code, such as configuration and initialization code. Many of the ROS tools are written in rospy to take advantage of the type introspection capabilities. Many of the ROS tools, such as<a href="http://ros.org/wiki/rostopic">rostopic</a>and<a href="http://ros.org/wiki/rosservice">rosservice</a>, are built on top of rospy.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
  run:
    - numpy
    - python
    - pyyaml
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-genpy
    - ros-noetic-roscpp
    - ros-noetic-rosgraph
    - ros-noetic-rosgraph-msgs
    - ros-noetic-roslib
    - ros-noetic-std-msgs
    - rospkg
