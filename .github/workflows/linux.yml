jobs:
  stage_0_job_0:
    name: moveit-ros-manipulation draco rtabmap-legacy rtabmap-examples jsk-interactive-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-noetic-moveit-ros-manipulation ros-noetic-draco ros-noetic-rtabmap-legacy
        ros-noetic-rtabmap-examples ros-noetic-jsk-interactive-test
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-noetic-moveit-ros-manipulation ros-noetic-draco ros-noetic-rtabmap-legacy
          ros-noetic-rtabmap-examples ros-noetic-jsk-interactive-test
        BUILD_TARGET: ''
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
  stage_1_job_1:
    name: moveit-ros-planning-interface draco-point-cloud-transport rtabmap-ros jsk-visualization
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs:
    - stage_0_job_0
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-noetic-moveit-ros-planning-interface ros-noetic-draco-point-cloud-transport
        ros-noetic-rtabmap-ros ros-noetic-jsk-visualization
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-noetic-moveit-ros-planning-interface ros-noetic-draco-point-cloud-transport
          ros-noetic-rtabmap-ros ros-noetic-jsk-visualization
        BUILD_TARGET: ''
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
  stage_2_job_2:
    name: moveit-commander moveit-ros-visualization moveit-planners-chomp webots-ros
      point-cloud-transport-plugins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs:
    - stage_1_job_1
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-noetic-moveit-commander ros-noetic-moveit-ros-visualization
        ros-noetic-moveit-planners-chomp ros-noetic-webots-ros ros-noetic-point-cloud-transport-plugins
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-noetic-moveit-commander ros-noetic-moveit-ros-visualization
          ros-noetic-moveit-planners-chomp ros-noetic-webots-ros ros-noetic-point-cloud-transport-plugins
        BUILD_TARGET: ''
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
  stage_2_job_3:
    name: moveit-servo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs:
    - stage_1_job_1
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-noetic-moveit-servo
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-noetic-moveit-servo
        BUILD_TARGET: ''
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
  stage_3_job_4:
    name: pilz-industrial-motion-planner-testutils moveit-setup-assistant moveit-ros
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs:
    - stage_2_job_2
    - stage_2_job_3
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-noetic-pilz-industrial-motion-planner-testutils ros-noetic-moveit-setup-assistant
        ros-noetic-moveit-ros
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-noetic-pilz-industrial-motion-planner-testutils ros-noetic-moveit-setup-assistant
          ros-noetic-moveit-ros
        BUILD_TARGET: ''
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
  stage_4_job_5:
    name: pilz-industrial-motion-planner panda-moveit-config moveit-planners moveit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    needs:
    - stage_3_job_4
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Build ros-noetic-pilz-industrial-motion-planner ros-noetic-panda-moveit-config
        ros-noetic-moveit-planners ros-noetic-moveit
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros-noetic-pilz-industrial-motion-planner ros-noetic-panda-moveit-config
          ros-noetic-moveit-planners ros-noetic-moveit
        BUILD_TARGET: ''
      run: |
        export CI=azure
        export GIT_BRANCH=$BUILD_SOURCEBRANCHNAME
        export FEEDSTOCK_NAME=$(basename ${BUILD_REPOSITORY_NAME})
        .scripts/build_unix.sh --target $BUILD_TARGET
name: build_linux64
on:
  push:
    branches:
    - buildbranch_linux
